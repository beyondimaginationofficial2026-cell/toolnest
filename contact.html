
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - ToolNest</title>
<meta name="description" content="Contact ToolNest with your questions, suggestions and feedback.">
<style>
body{font-family:Arial,sans-serif;line-height:1.7;margin:0;background:#f4f7fb;color:#172033}
header{background:#172554;color:white;text-align:center;padding:25px}
main{max-width:750px;margin:25px auto;padding:25px;background:white;border-radius:12px}
h2{color:#1e40af}
a{color:#2563eb}
label{display:block;font-weight:bold;margin-top:12px}
input,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
button{background:#2563eb;color:white;border:0;padding:12px 20px;border-radius:7px;margin-top:15px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>Contact Us</h1>
<p>We would love to hear from you</p>
</header>

<main>
<h2>Get in Touch</h2>
<p>If you have questions, suggestions or feedback about ToolNest, you can contact us using the form below.</p>

<form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST">
<label for="name">Your Name</label>
<input type="text" id="name" name="name" placeholder="Enter your name" required>

<label for="email">Your Email</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>

<label for="message">Your Message</label>
<textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

<input type="hidden" name="_subject" value="New message from ToolNest">
<input type="hidden" name="_captcha" value="true">
<button type="submit">Send Message</button>
</form>

<p class="small">The contact form will work after the website owner's email is configured and verified with the form service.</p>

<p><a href="index.html">Back to ToolNest Home</a></p>
</main>
</body>
</html>
